<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авиационная безопасность — Тест и Шпаргалка к зачёту</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --success: #16a34a;
      --success-hover: #15803d;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --purple: #7c3aed;
      --purple-light: #f3e8ff;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --bg: #0b1329;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-light: #082f49;
      --success: #4ade80;
      --success-hover: #22c55e;
      --success-light: #064e3b;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --danger-light: #450a0a;
      --warning: #fbbf24;
      --warning-light: #451a03;
      --purple: #c084fc;
      --purple-light: #3b0764;
      --shadow: 0 4px 8px rgba(0,0,0,0.3);
      --shadow-hover: 0 12px 20px rgba(0,0,0,0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color 0.25s, color 0.25s;
      padding-bottom: 70px;
    }

    /* Шапка */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: padding 0.25s ease;
    }

    header.collapsed {
      padding: 8px 14px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header.collapsed .header-container {
      gap: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      transition: all 0.2s ease;
    }

    .header-title h1 {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title p {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Компактный индикатор в свернутом виде */
    .mini-bar {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #38bdf8;
    }

    header.collapsed .header-title {
      display: none;
    }

    header.collapsed .mini-bar {
      display: flex;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      outline: none;
      transition: all 0.2s;
    }

    .btn-hdr {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-hdr:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .btn-toggle-hdr {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .btn-toggle-hdr:hover {
      background: rgba(56, 189, 248, 0.35);
      color: #ffffff;
    }

    .btn-start-quiz {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      padding: 8px 15px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .btn-start-quiz:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.5);
    }

    /* Прогресс-бар */
    .progress-section {
      background: rgba(255, 255, 255, 0.08);
      padding: 9px 12px;
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.2s ease;
    }

    header.collapsed .progress-section {
      display: none;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8 0%, #4ade80 100%);
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    /* Основной контейнер */
    .main-wrap {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 16px;
    }

    /* Контролы и фильтры */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    .filters-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .global-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .btn-act {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .btn-act:hover {
      background: var(--border);
    }

    /* Карточки вопросов */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .q-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .q-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .q-card.learned {
      border-left: 6px solid var(--success);
    }

    .q-card.unlearned {
      border-left: 6px solid var(--warning);
    }

    .card-head {
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: background 0.15s;
    }

    .card-head:hover {
      background: rgba(2, 132, 199, 0.03);
    }

    .q-card.open .card-head {
      background: rgba(2, 132, 199, 0.05);
      border-bottom: 1px solid var(--border);
    }

    .card-head-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .num-badge {
      font-size: 0.82rem;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      white-space: nowrap;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    .card-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .tag-intl { background: var(--purple-light); color: var(--purple); }
    .tag-law { background: var(--primary-light); color: var(--primary); }
    .tag-crew { background: var(--danger-light); color: var(--danger); }
    .tag-sec { background: var(--warning-light); color: var(--warning); }

    .status-icon {
      font-size: 1.15rem;
    }

    .chevron {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      transition: transform 0.25s;
    }

    .q-card.open .chevron {
      transform: rotate(180deg);
    }

    .card-body {
      padding: 18px;
      display: none;
      font-size: 0.94rem;
      color: var(--text-main);
    }

    .q-card.open .card-body {
      display: block;
    }

    .learn-toggle-bar {
      margin-bottom: 16px;
      display: flex;
      justify-content: flex-start;
    }

    .btn-learn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
    }

    .btn-learn.to-learn {
      background: var(--success-light);
      color: var(--success);
      border-color: var(--success);
    }

    .btn-learn.to-learn:hover {
      background: var(--success);
      color: #ffffff;
    }

    .btn-learn.is-learned {
      background: var(--warning-light);
      color: var(--warning);
      border-color: var(--warning);
    }

    .btn-learn.is-learned:hover {
      background: var(--warning);
      color: #ffffff;
    }

    /* Блоки оформления ответов */
    .box {
      border-radius: 10px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .box-summary { background: var(--primary-light); border-left: 4px solid var(--primary); }
    .box-steps { background: var(--purple-light); border-left: 4px solid var(--purple); }
    .box-warning { background: var(--warning-light); border-left: 4px solid var(--warning); }
    .box-danger { background: var(--danger-light); border-left: 4px solid var(--danger); }
    .box-law { background: var(--bg); border: 1px solid var(--border); border-left: 4px solid var(--text-muted); }

    .box-title {
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    ul, ol {
      margin-left: 20px;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    li { margin-bottom: 5px; }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      margin-top: 16px;
    }

    .btn-copy {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-copy:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Модальное окно теста */
    .quiz-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .quiz-overlay.active {
      display: flex;
    }

    .quiz-modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: modalIn 0.25s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .quiz-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .quiz-header-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-quiz-close {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .btn-quiz-close:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .quiz-subbar {
      padding: 10px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quiz-subbar-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .quiz-track {
      width: 100%;
      height: 7px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8 0%, #2563eb 100%);
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 22px;
      overflow-y: auto;
      flex: 1;
    }

    .quiz-question-card {
      margin-bottom: 20px;
    }

    .quiz-q-num {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .quiz-q-title {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.4;
      color: var(--text-main);
    }

    .quiz-reveal-wrap {
      margin: 18px 0;
      text-align: center;
    }

    .btn-reveal {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px dashed var(--primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reveal:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .quiz-answer-content {
      display: none;
      animation: fadeIn 0.25s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quiz-footer {
      padding: 16px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .eval-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-eval {
      flex: 1;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .btn-eval-wrong {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-eval-wrong:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-eval-correct {
      background: var(--success);
      color: #ffffff;
    }

    .btn-eval-correct:hover {
      background: var(--success-hover);
    }

    .quiz-result-view {
      text-align: center;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .quiz-result-icon { font-size: 3.5rem; }
    .quiz-result-title { font-size: 1.5rem; font-weight: 800; }

    .quiz-stats-grid {
      display: flex;
      gap: 16px;
      margin: 10px 0 20px;
      width: 100%;
      max-width: 460px;
    }

    .stat-box {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .stat-val { font-size: 1.6rem; font-weight: 800; }
    .stat-lbl { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    @media (max-width: 680px) {
      .header-title h1 { font-size: 1.15rem; }
      .card-head { flex-direction: column; align-items: flex-start; }
      .card-head-right { width: 100%; justify-content: space-between; }
      .eval-buttons { flex-direction: column; }
      .quiz-stats-grid { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ С КНОПКОЙ СВОРАЧИВАНИЯ -->
  <header id="mainHeader">
    <div class="header-container">
      <div class="header-top">
        <!-- Полный заголовок -->
        <div class="header-title" id="headerTitle">
          <h1>✈️ Авиационная безопасность (АБ)</h1>
          <p>Интерактивная шпаргалка & Тренажёр к зачёту • Специальность 25.02.04</p>
        </div>

        <!-- Компактная плашка при скрытии -->
        <div class="mini-bar" id="miniBar">
          <span>✈️ АБ (25.02.04)</span>
          <span style="color: #94a3b8; font-size: 0.8rem;" id="miniProgressText">• 0/30</span>
        </div>

        <!-- Кнопки управления -->
        <div class="header-btns">
          <button class="btn-start-quiz" onclick="startQuizMode()">🎯 Тест</button>
          <button class="btn-hdr btn-toggle-hdr" id="toggleHeaderBtn" onclick="toggleHeaderCollapse()">🔼 Свернуть</button>
          <button class="btn-hdr" onclick="resetProgress()">🔄 Сброс</button>
          <button class="btn-hdr" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
      </div>

      <!-- Большой прогресс-бар -->
      <div class="progress-section" id="headerProgress">
        <div class="progress-labels">
          <span id="progressText">Прогресс: 0 из 30 выучено</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="main-wrap">
    <section class="controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск по номеру, ключевому слову или закону (ст. 58, 211, ФАП-275)..." oninput="applyFilters()">
      </div>

      <div class="filters-wrap">
        <button class="filter-btn active" onclick="setFilter('all', this)">📂 Все (30)</button>
        <button class="filter-btn" onclick="setFilter('unlearned', this)">⏳ Надо выучить (<span id="countUnlearned">30</span>)</button>
        <button class="filter-btn" onclick="setFilter('learned', this)">✅ Выучено (<span id="countLearned">0</span>)</button>
        <button class="filter-btn" onclick="setFilter('intl', this)">🌐 Конвенции</button>
        <button class="filter-btn" onclick="setFilter('law', this)">🇷🇺 Законы РФ / ФАП</button>
        <button class="filter-btn" onclick="setFilter('crew', this)">👨‍✈️ Экипаж при АНВ</button>
        <button class="filter-btn" onclick="setFilter('sec', this)">🔍 Досмотр и режим</button>
        <button class="filter-btn" onclick="setFilter('bomb', this)">💣 Взрывные угрозы</button>
      </div>

      <div class="global-actions">

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const cards = document.querySelectorAll(".q-card");

      cards.forEach(card => {
        const id = parseInt(card.dataset.id);
        const item = questions.find(q => q.id === id);
        const isLearned = learnedSet.has(id);

        let matchesCategory = false;
        if (activeFilter === 'all') matchesCategory = true;
        else if (activeFilter === 'learned') matchesCategory = isLearned;
        else if (activeFilter === 'unlearned') matchesCategory = !isLearned;
        else if (activeFilter === 'bomb') matchesCategory = (item.cat === 'bomb');
        else matchesCategory = (item.cat === activeFilter);

        const cardText = item.title.toLowerCase() + " " + card.innerText.toLowerCase();
        const matchesQuery = !query || cardText.includes(query) || item.id.toString() === query;

        if (matchesCategory && matchesQuery) {

          visible++;

      currentQuizIndex = 0;
      quizInitialTotal = quizQueue.length;
      quizCorrectCount = 0;
      quizRepeatedCount = 0;

      document.getElementById('quizOverlay').classList.add('active');
      document.getElementById('quizSubbar').style.display = 'flex';
      document.getElementById('quizFooter').style.display = 'flex';
      loadCurrentQuizQuestion();
    }

    function closeQuizMode() {
      document.getElementById('quizOverlay').classList.remove('active');
      renderApp();
    }

    function loadCurrentQuizQuestion() {
      if (quizQueue.length === 0) {
        showQuizResults();
        return;
      }

      const currentQ = quizQueue[0];
      const remaining = quizQueue.length;
      const progressPercent = Math.min(100, Math.round((quizCorrectCount / quizInitialTotal) * 100));

      document.getElementById('quizIndexLabel').innerText = `Вопрос №${currentQ.id} (${quizCorrectCount + 1} из ${quizInitialTotal})`;
      document.getElementById('quizRemainingLabel').innerText = `Осталось в очереди: ${remaining}`;
      document.getElementById('quizProgressFill').style.width = `${progressPercent}%`;

      const body = document.getElementById('quizBody');
      body.innerHTML = `
        <div class="quiz-question-card">
          <span class="quiz-q-num">Вопрос № ${currentQ.id} • ${currentQ.tag}</span>
          <h2 class="quiz-q-title">${currentQ.title}</h2>
        </div>

        <div class="quiz-reveal-wrap" id="revealWrap">
          <button class="btn-reveal" onclick="revealAnswer()">
            👁️ Показать эталонный ответ
          </button>
        </div>

        <div class="quiz-answer-content" id="answerContent">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 8px;">
            📖 Эталонный ответ для самопроверки:
          </div>
          ${currentQ.content}
        </div>
      `;

      document.getElementById('evalButtons').style.display = 'none';
      body.scrollTop = 0;
    }

    function revealAnswer() {
      document.getElementById('revealWrap').style.display = 'none';
      document.getElementById('answerContent').style.display = 'block';
      document.getElementById('evalButtons').style.display = 'flex';
    }

    function handleQuizAnswer(isCorrect) {
      const currentQ = quizQueue.shift();

      if (isCorrect) {
        learnedSet.add(currentQ.id);
        localStorage.setItem('learned_ab_ids', JSON.stringify(Array.from(learnedSet)));
        quizCorrectCount++;
      } else {
        quizQueue.push(currentQ);
        quizRepeatedCount++;
      }

      loadCurrentQuizQuestion();
    }

    function showQuizResults() {
      document.getElementById('quizSubbar').style.display = 'none';
      document.getElementById('quizFooter').style.display = 'none';

      const body = document.getElementById('quizBody');
      body.innerHTML = `
        <div class="quiz-result-view">
          <div class="quiz-result-icon">🏆</div>
          <h2 class="quiz-result-title">Тест успешно завершён!</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            Все вопросы текущей сессии были отработаны и закреплены.
          </p>

          <div class="quiz-stats-grid">
            <div class="stat-box">
              <div class="stat-val" style="color: var(--success);">${quizCorrectCount}</div>
              <div class="stat-lbl">Выучено за тест</div>
            </div>
            <div class="stat-box">
              <div class="stat-val" style="color: var(--warning);">${quizRepeatedCount}</div>
              <div class="stat-lbl">Повторов из-за ошибок</div>
            </div>
            <div class="stat-box">
              <div class="stat-val" style="color: var(--primary);">${learnedSet.size} / 30</div>
              <div class="stat-lbl">Всего выучено в базе</div>
            </div>
          </div>

          <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button class="btn-start-quiz" onclick="startQuizMode()">🔄 Пройти ещё раунд</button>
            <button class="btn-act" style="padding: 10px 18px;" onclick="closeQuizMode()">Вернуться к билетам</button>
          </div>
        </div>
      `;
    }

    // Запуск при старте страницы
    document.addEventListener("DOMContentLoaded", () => {
      // Восстановление темы
      if (localStorage.getItem('ab_theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeBtn').innerText = '☀️';
      }

      // Восстановление свернутого состояния шапки
      if (localStorage.getItem('ab_header_collapsed') === 'true') {
        document.getElementById("mainHeader").classList.add("collapsed");
        document.getElementById("toggleHeaderBtn").innerHTML = "🔽 Меню";
      }

      renderApp();
    });
  </script>
</body>
</html>
